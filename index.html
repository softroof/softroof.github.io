<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=yes" />
    <title id="pageTitle">Soft Roof Cafe · menu</title>
    <link href="https://fonts.googleapis.com/css2?family=Bona+Nova+SC:ital,wght@0,400;0,700;1,400&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ----- reset & variables ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg-body: #fefaf5;
            --bg-header: #2c1a1a;
            --bg-card: rgba(255, 250, 250, 0.96);
            --bg-card-hover: rgba(255, 245, 245, 1);
            --text-primary: #2c1a1a;
            --text-heading: #8b1a1a;
            --text-price: #b33a1a;
            --price-bg: #fde8e0;
            --border-card: rgba(200, 160, 150, 0.5);
            --border-card-hover: #c07060;
            --shadow-card: 0 5px 12px rgba(0, 0, 0, 0.03);
            --shadow-card-hover: 0 14px 24px rgba(0, 0, 0, 0.05);
            --section-bg: radial-gradient(circle at 10% 30%, rgba(240, 210, 200, 0.3), rgba(250, 240, 235, 0.7));
            --sticky-bg: rgba(254, 250, 245, 0.92);
            --sticky-bg-active: rgba(254, 250, 245, 0.96);
            --scroll-track: #eae6df;
            --scroll-thumb: #d0b0a0;
            --scroll-thumb-hover: #b08070;
            --cat-btn-bg: #fffaf4;
            --cat-btn-border: #e5d0c8;
            --cat-btn-text: #5a3020;
            --cat-btn-active-bg: #8b2a1a;
            --cat-btn-active-text: white;
            --cat-btn-hover-bg: #f5e0d8;
            --footer-color: #8a6a5a;
            --footer-border: rgba(200, 170, 160, 0.5);
            --hint-left: linear-gradient(to right, rgba(254, 250, 245, 0.95), transparent);
            --hint-right: linear-gradient(to left, rgba(254, 250, 245, 0.95), transparent);
            --lang-toggle-bg: rgba(255, 250, 242, 0.9);
            --lang-toggle-border: rgba(220, 200, 190, 0.8);
            --lang-toggle-color: #5a3020;
            --social-icon-color: #fef5e6;
            --social-icon-bg: rgba(0, 0, 0, 0.4);
            --social-icon-border: rgba(255, 245, 215, 0.5);
            --social-icon-hover-bg: #8b2a1acc;
            --refresh-btn-bg: #8b2a1a;
            --refresh-btn-hover: #b03a2a;
            --shadow-header: 0 6px 14px rgba(0, 0, 0, 0.2);
            --shadow-sticky: 0 4px 12px rgba(0, 0, 0, 0.03);
            --shadow-sticky-active: 0 4px 18px rgba(0, 0, 0, 0.08);
            --scroll-arrow-bg: #8b2a1ae6;
            --scroll-arrow-color: white;
            --logo-bg: #f0e0d8;
            --switch-bg: rgba(44, 26, 26, 0.92);
            --switch-text: #fef7e0;
            --switch-active-bg: #8b2a1a;
            --switch-inactive-bg: rgba(255, 255, 240, 0.15);
            --back-top-bg: #8b2a1a;
            --back-top-hover: #b03a2a;
            --back-top-color: #fff;
            /* modal */
            --modal-overlay: rgba(0, 0, 0, 0.55);
            --modal-bg: #fefaf5;
            --modal-text: #2c1a1a;
            --modal-heading: #8b1a1a;
            --modal-btn-bg: #8b2a1a;
            --modal-btn-hover: #b03a2a;
            --modal-btn-text: #fff;
            --modal-btn-border: rgba(200, 160, 150, 0.3);
            --modal-close-color: #5a3020;
            --modal-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
            /* owner button */
            --owner-btn-bg: #8b2a1a;
            --owner-btn-hover: #b03a2a;
            --owner-btn-text: #fff;
            --owner-btn-border: rgba(255, 255, 240, 0.3);
        }
        body.dark-mode {
            --bg-body: #1a0e0e;
            --bg-header: #1a0a0a;
            --bg-card: rgba(30, 20, 20, 0.92);
            --bg-card-hover: rgba(40, 25, 25, 0.96);
            --text-primary: #e8d8d0;
            --text-heading: #d08070;
            --text-price: #e07050;
            --price-bg: #2a1a10;
            --border-card: rgba(100, 70, 60, 0.5);
            --border-card-hover: #b06050;
            --shadow-card: 0 5px 12px rgba(0, 0, 0, 0.3);
            --shadow-card-hover: 0 14px 24px rgba(0, 0, 0, 0.4);
            --section-bg: radial-gradient(circle at 10% 30%, rgba(60, 30, 20, 0.5), rgba(20, 10, 10, 0.8));
            --sticky-bg: rgba(20, 10, 10, 0.92);
            --sticky-bg-active: rgba(20, 10, 10, 0.96);
            --scroll-track: #2a1a1a;
            --scroll-thumb: #6a4030;
            --scroll-thumb-hover: #8a6050;
            --cat-btn-bg: #2a1a1a;
            --cat-btn-border: #4a3020;
            --cat-btn-text: #d0c0b0;
            --cat-btn-active-bg: #8b2a1a;
            --cat-btn-active-text: #ffffff;
            --cat-btn-hover-bg: #3a2218;
            --footer-color: #7a5a4a;
            --footer-border: rgba(80, 50, 40, 0.5);
            --hint-left: linear-gradient(to right, rgba(20, 10, 10, 0.95), transparent);
            --hint-right: linear-gradient(to left, rgba(20, 10, 10, 0.95), transparent);
            --lang-toggle-bg: rgba(40, 20, 20, 0.9);
            --lang-toggle-border: rgba(80, 50, 40, 0.6);
            --lang-toggle-color: #d0c0b0;
            --social-icon-color: #d0c0b0;
            --social-icon-bg: rgba(0, 0, 0, 0.6);
            --social-icon-border: rgba(200, 180, 160, 0.3);
            --social-icon-hover-bg: #8b2a1acc;
            --refresh-btn-bg: #8b2a1a;
            --refresh-btn-hover: #b03a2a;
            --shadow-header: 0 6px 14px rgba(0, 0, 0, 0.6);
            --shadow-sticky: 0 4px 12px rgba(0, 0, 0, 0.4);
            --shadow-sticky-active: 0 4px 18px rgba(0, 0, 0, 0.5);
            --scroll-arrow-bg: #8b2a1ae6;
            --scroll-arrow-color: #eee;
            --logo-bg: #2a1a1a;
            --switch-bg: rgba(20, 10, 10, 0.95);
            --switch-text: #e8d8d0;
            --switch-active-bg: #8b2a1a;
            --switch-inactive-bg: rgba(255, 255, 240, 0.08);
            --back-top-bg: #8b2a1a;
            --back-top-hover: #b03a2a;
            --back-top-color: #eee;
            /* modal dark */
            --modal-overlay: rgba(0, 0, 0, 0.7);
            --modal-bg: #1a0e0e;
            --modal-text: #e8d8d0;
            --modal-heading: #d08070;
            --modal-btn-bg: #8b2a1a;
            --modal-btn-hover: #b03a2a;
            --modal-btn-text: #fff;
            --modal-btn-border: rgba(100, 70, 60, 0.4);
            --modal-close-color: #d0c0b0;
            --modal-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            /* owner button dark */
            --owner-btn-bg: #8b2a1a;
            --owner-btn-hover: #b03a2a;
            --owner-btn-text: #fff;
        }
        body {
            background: var(--bg-body);
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            color: var(--text-primary);
            line-height: 1.4;
            transition: background 0.3s, color 0.3s;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }
        /* ----- header ----- */
        .header-bg {
            position: relative;
            background: var(--bg-header);
            overflow: hidden;
        }
        .header-bg::before {
            content: "";
            position: absolute;
            inset: 0;
            background: url('https://drive.google.com/thumbnail?id=13D5-EmA4kOICU8bra2RzaqVhybY39AeQ&sz=s800') center 30%/cover no-repeat;
            filter: blur(1px);
            transform: scale(1.05);
            z-index: 0;
        }
        .header-bg::after {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: 1;
        }
        body.dark-mode .header-bg::after {
            background: rgba(0, 0, 0, 0.65);
        }
        .header-content {
            position: relative;
            z-index: 2;
            padding: 0.8rem 0.8rem 0.5rem;
        }
        .cafe-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 1rem;
        }
        .header-content .cafe-container {
            padding: 0 0.5rem;
        }
        .handmade-line {
            width: 60px;
            height: 2px;
            background: #d0b0a0;
            margin: 0.5rem auto 0.4rem;
            border-radius: 2px;
        }
        body.dark-mode .handmade-line {
            background: #6a4030;
        }
        .logo-block {
            text-align: center;
            margin: 0.8rem 0 0.5rem;
        }
        .logo-owner-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 0.4rem;
        }
        .logo-img {
            width: 140px;
            height: 140px;
            object-fit: cover;
            background: var(--logo-bg);
            border-radius: 30%;
            scale: 1.0;
            box-shadow: var(--shadow-header);
            border: 2px solid rgba(255, 255, 240, 0.6);
            transition: background 0.3s;
            max-width: 90vw;
        }
        .cafe-name {
            font-size: 1.6rem;
            font-weight: 700;
            margin-top: 0.5rem;
            color: #fef7e0;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
        }
        .tagline {
            font-size: 0.7rem;
            font-style: italic;
            color: #f8f0da;
            margin-top: 0.1rem;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.4);
        }
        .controls-wrapper {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 0.2rem;
        }
        .lang-toggle,
        .dark-toggle {
            background: var(--lang-toggle-bg);
            backdrop-filter: blur(4px);
            border: 1px solid var(--lang-toggle-border);
            border-radius: 60px;
            padding: 0.4rem 0.9rem;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--lang-toggle-color);
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }
        .lang-toggle i,
        .dark-toggle i {
            font-size: 0.85rem;
        }
        .lang-toggle:hover,
        .dark-toggle:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-card-hover);
            transform: scale(0.98);
        }
        .social-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
            margin: 0.6rem 0 0.2rem;
        }
        .social-icon {
            color: var(--social-icon-color);
            font-size: 1.1rem;
            background: var(--social-icon-bg);
            width: 34px;
            height: 34px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 40px;
            text-decoration: none;
            border: 1px solid var(--social-icon-border);
            transition: 0.2s;
            backdrop-filter: blur(2px);
        }
        .social-icon:hover {
            color: #fff;
            background: var(--social-icon-hover-bg);
            transform: translateY(-2px);
            border-color: #f5d8c8;
        }
        /* ----- owner strip (now contains the button) ----- */
        .owner-strip {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.75rem;
            padding: 0.3rem 1rem 0.2rem;
            flex-wrap: wrap;
        }
        .owner-strip span {
            font-size: 1rem;
            font-weight: 600;
            color: var(--footer-color);
            letter-spacing: 0.5px;
        }
        .owner-strip .highlight {
            color: var(--text-price);
            font-weight: 700;
        }
        /* ----- small owner button (rectangle rounded) ----- */
        .owner-btn-small {
            display: inline-block;
            background: var(--owner-btn-bg);
            color: var(--owner-btn-text);
            border: none;
            padding: 0.3rem 1.2rem;
            border-radius: 30px;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 0.3px;
            cursor: pointer;
            transition: background 0.25s, transform 0.2s, box-shadow 0.25s;
            box-shadow: 0 2px 8px rgba(139, 42, 26, 0.25);
            border: 1px solid var(--owner-btn-border);
            line-height: 1.4;
            text-align: center;
        }
        .owner-btn-small:hover {
            background: var(--owner-btn-hover);
            transform: scale(1.03);
            box-shadow: 0 4px 14px rgba(139, 42, 26, 0.35);
        }
        .owner-btn-small:active {
            transform: scale(0.97);
        }
        body.rtl .owner-btn-small {
            font-family: 'Cairo', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }
        /* ----- sticky navigation (dual) ----- */
        .sticky-nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--sticky-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--footer-border);
            padding: 0.3rem 0 0.6rem;
            transition: all 0.2s;
            box-shadow: var(--shadow-sticky);
        }
        .sticky-nav.sticky-active {
            box-shadow: var(--shadow-sticky-active);
            background: var(--sticky-bg-active);
        }
        .nav-toggle-wrap {
            display: flex;
            justify-content: center;
            margin: 0.2rem 0 0.6rem;
        }
        .nav-tabs {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 0.45rem;
            padding: 0.45rem;
            border: 1px solid var(--cat-btn-border);
            border-radius: 999px;
            background: var(--cat-btn-bg);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            width: fit-content;
            flex-wrap: wrap;
        }
        .nav-tab {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: transparent;
            border: none;
            font-size: 1.05rem;
            font-weight: 700;
            padding: 0.7rem 1.5rem;
            cursor: pointer;
            color: var(--cat-btn-text);
            transition: all 0.2s ease;
            border-radius: 999px;
            min-width: 105px;
        }
        .nav-tab.active {
            background: var(--cat-btn-active-bg);
            color: var(--cat-btn-active-text);
            box-shadow: 0 4px 10px rgba(139, 42, 26, 0.2);
        }
        .nav-tab:hover:not(.active) {
            background: var(--cat-btn-hover-bg);
        }
        .scroll-menu-wrapper {
            position: relative;
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 0.8rem;
        }
        .scroll-menu {
            overflow-x: auto;
            overflow-y: hidden;
            white-space: nowrap;
            scrollbar-width: thin;
            padding-bottom: 0.4rem;
            cursor: grab;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }
        .scroll-menu:active {
            cursor: grabbing;
        }
        .scroll-menu::-webkit-scrollbar {
            height: 4px;
        }
        .scroll-menu::-webkit-scrollbar-track {
            background: var(--scroll-track);
            border-radius: 10px;
        }
        .scroll-menu::-webkit-scrollbar-thumb {
            background: var(--scroll-thumb);
            border-radius: 10px;
        }
        .scroll-menu::-webkit-scrollbar-thumb:hover {
            background: var(--scroll-thumb-hover);
        }
        .menu-buttons {
            display: inline-flex;
            gap: 0.6rem;
            padding: 0.2rem 0.1rem;
        }
        .cat-btn {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: var(--cat-btn-bg);
            border: 1px solid var(--cat-btn-border);
            padding: 0.4rem 1.2rem;
            font-size: 0.85rem;
            border-radius: 60px;
            cursor: pointer;
            color: var(--cat-btn-text);
            transition: all 0.2s;
            font-weight: 600;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
            white-space: nowrap;
        }
        .cat-btn.active {
            background: var(--cat-btn-active-bg);
            color: var(--cat-btn-active-text);
            border-color: var(--cat-btn-active-bg);
            box-shadow: 0 4px 8px rgba(139, 42, 26, 0.3);
        }
        .cat-btn:hover:not(.active) {
            background: var(--cat-btn-hover-bg);
            transform: translateY(-1px);
        }
        .scroll-hint-left,
        .scroll-hint-right {
            position: absolute;
            top: 0;
            bottom: 4px;
            width: 35px;
            pointer-events: none;
            z-index: 5;
            transition: opacity 0.25s;
        }
        .scroll-hint-left {
            left: 0;
            background: var(--hint-left);
        }
        .scroll-hint-right {
            right: 0;
            background: var(--hint-right);
        }
        /* ----- menu sections ----- */
        .sections-wrapper {
            position: relative;
            background: var(--section-bg);
            backdrop-filter: blur(3px);
            border-radius: 1.5rem 1.5rem 0 0;
            margin-top: 0.3rem;
            padding: 1rem 0 5rem;
            box-shadow: inset 0 1px 20px rgba(160, 120, 100, 0.08), 0 8px 20px rgba(0, 0, 0, 0.02);
            transition: background 0.3s;
        }
        .sections-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.2rem;
        }
        .menu-section {
            display: none;
            grid-column: 1 / -1;
        }
        .menu-section.active-section {
            display: block;
        }
        .menu-section .menu-items-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 1rem;
        }
        @media (min-width:769px) {
            .menu-section .menu-items-grid {
                padding: 0 8rem;
            }
        }
        .menu-card {
            background: var(--bg-card);
            backdrop-filter: blur(2px);
            border-radius: 24px;
            padding: 0.8rem 0.5rem;
            border: 1px solid var(--border-card);
            transition: all 0.25s;
            box-shadow: var(--shadow-card);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 0.25rem;
            width: 100%;
            height: 100%;
        }
        .menu-card:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-card-hover);
            transform: translateY(-3px);
            box-shadow: var(--shadow-card-hover);
        }
        .menu-item-img {
            width: 100%;
            aspect-ratio: 1/1;
            border-radius: 16px;
            object-fit: cover;
            flex-shrink: 0;
            border: 2px solid var(--border-card);
            background: var(--bg-body);
            transition: border-color 0.3s, transform 0.2s;
            margin-bottom: 0.1rem;
            max-width: 100%;
        }
        .menu-card:hover .menu-item-img {
            border-color: var(--border-card-hover);
            transform: scale(1.02);
        }
        .item-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-heading);
            letter-spacing: -0.2px;
            text-align: center;
            width: 100%;
            word-break: break-word;
            line-height: 1.3;
        }
        .price {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--text-price);
            background: var(--price-bg);
            padding: 0.3rem 0rem;
            border-radius: 50px;
            white-space: normal;
            word-break: break-word;
            overflow-wrap: anywhere;
            border: 2px solid var(--border-card);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            line-height: 1.3;
            display: inline-block;
            text-align: center;
            margin-top: 0.1rem;
            letter-spacing: 0.5px;
            width: 100%;
            max-width: 130px;
            transition: background 0.3s, color 0.3s, border-color 0.3s;
        }
        .price .currency {
            font-size: 0.85em;
            font-weight: 700;
            display: inline-block;
            margin-left: 0.25rem;
            vertical-align: middle;
        }
        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: var(--text-heading);
            border-left: 5px solid #c07060;
            padding-left: 0.8rem;
            text-shadow: 0 1px 1px rgba(255, 200, 180, 0.3);
            transition: color 0.3s, border-color 0.3s;
        }
        body.dark-mode .section-title {
            border-left-color: #8a5040;
        }
        body.rtl .section-title {
            border-left: none;
            border-right: 5px solid #c07060;
            padding-left: 0;
            padding-right: 0.8rem;
        }
        body.dark-mode.rtl .section-title {
            border-right-color: #8a5040;
        }
        /* ----- back to top ----- */
        .back-top {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 300;
            background: var(--back-top-bg);
            color: var(--back-top-color);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
            transition: all 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: translateY(16px);
        }
        .back-top.show {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            transform: translateY(0);
        }
        .back-top:hover {
            background: var(--back-top-hover);
            transform: scale(1.08);
        }
        /* ----- rtl adjustments ----- */
        body.rtl {
            direction: rtl;
            text-align: right;
            font-family: 'Cairo', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }
        body.rtl .scroll-hint-left {

                        desc: "كرواسون بالزبدة مع تركي مدخن، جبنة شيدر وخس طازج.", price: "145",
                        image: "https://drive.google.com/thumbnail?id=1AH03TmMOHE4-drt6Ft0ihRLO5CGfPgOS&sz=s800" },
                    { name: "Butter croissant with roast beef, cheddar cheese, lettuce & honey mustard.",
                        desc: "كرواسون بالزبدة مع روست بيف، شيدر، خس وصوص هاني ماسترد.", price: "150",
                        image: "https://drive.google.com/thumbnail?id=1AgXZ1vztfUR6SGnQAtBCJkmOLgaNczRT&sz=s800" },
                    { name: "Butter croissant with tuna mix, lettuce & pickles.",
                        desc: "كرواسون بالزبدة مع تونة، خس ومخلل.", price: "150",
                        image: "https://drive.google.com/thumbnail?id=1i3OMTdS1exkLFEBWkHnRt8rDQjXAswA-&sz=s800" }
                ]
            },
            // ===== BIRTHDAY PACKAGES (new category) =====
            {
                id: "birthday",
                label: "Birthday Packages",
                title: "باقات عيد الميلاد",
                category: "birthday",
                items: [{
                    name: "Birthday Package 1",
                    desc: "مناسب حتى 5 أشخاص",
                    price: "250",
                    image: "https://picsum.photos/seed/birthday1/400/400"
                }, {
                    name: "Birthday Package 2",
                    desc: "مناسب من 5 إلى 10 أشخاص",
                    price: "500",
                    image: "https://picsum.photos/seed/birthday2/400/400"
                }, {
                    name: "Birthday Package 3",
                    desc: "مناسب لأكثر من 10 أشخاص",
                    price: "1000",
                    image: "https://picsum.photos/seed/birthday3/400/400"
                }]
            }]
        };

        // ========================================================================
        //  STATE
        // ========================================================================
        let currentLanguage = 'en';
        let selectedTab = 'drinks';
        let allSections = [];
        let categoryButtonsRef = [];
        let scrollHintAnimationShown = false;
        let currentMenuData = null;
        let darkMode = false;

        // ========================================================================
        //  HELPERS
        // ========================================================================
        function getCategoryDisplayName(cat) {
            if (currentLanguage === 'en') return cat.label || cat.id;
            return cat.title || cat.label || cat.id;
        }

        function getItemName(item) {
            if (currentLanguage === 'en') return item.name || 'Item';
            return item.desc || item.name || 'عنصر';
        }

        function getItemImage(item) {
            if (item.image && item.image !== '') return item.image;
            return 'https://i.etsystatic.com/16237790/r/il/591da5/5840470695/il_fullxfull.5840470695_gwx4.jpg';
        }

        function getTranslation(key) {
            const lang = currentLanguage === 'ar' ? 'ar' : 'en';
            return TRANSLATIONS[lang]?.[key] || key;
        }

        function applyRTL() {
            if (currentLanguage === 'ar') {
                document.body.classList.add('rtl');
                document.documentElement.lang = 'ar';
                document.documentElement.dir = 'rtl';
            } else {
                document.body.classList.remove('rtl');
                document.documentElement.lang = 'en';
                document.documentElement.dir = 'ltr';
            }
            setTimeout(updateScrollHints, 50);
        }

        function updateScrollHints() {
            const scrollDiv = document.getElementById('scrollMenuContainer');
            if (!scrollDiv) return;
            const l = document.getElementById('scrollHintLeft'),
                r = document.getElementById('scrollHintRight');
            if (!l || !r) return;
            const sl = scrollDiv.scrollLeft,
                max = scrollDiv.scrollWidth - scrollDiv.clientWidth;
            l.style.opacity = sl > 6 ? '1' : '0';
            r.style.opacity = (max - sl) > 8 ? '1' : '0';
        }

        // ========================================================================
        //  APPLY STATIC TRANSLATIONS
        // ========================================================================
        function applyStaticTranslations() {
            const t = currentLanguage === 'ar' ? TRANSLATIONS.ar : TRANSLATIONS.en;

            document.title = t.title;
            const titleEl = document.getElementById('pageTitle');
            if (titleEl) titleEl.textContent = t.title;

            const nameEl = document.getElementById('cafeNameEl');
            if (nameEl) nameEl.textContent = t.cafeName;

            const tagEl = document.getElementById('taglineEl');
            if (tagEl) tagEl.textContent = t.tagline;

            const ownerEl = document.getElementById('ownerHighlight');
            if (ownerEl) ownerEl.textContent = t.ownerBy;

            const tabDrinks = document.getElementById('tabDrinks');
            const tabFood = document.getElementById('tabFood');
            const tabBirthday = document.getElementById('tabBirthday');
            if (tabDrinks) tabDrinks.textContent = t.drinks;
            if (tabFood) tabFood.textContent = t.food;
            if (tabBirthday) tabBirthday.textContent = t.birthday;

            const darkText = document.getElementById('darkToggleText');
            if (darkText) darkText.textContent = darkMode ? t.darkOn : t.darkOff;

            const logo = document.getElementById('mainLogo');
            if (logo) logo.alt = t.logoAlt;

            // owner button text
            const ownerBtnText = document.getElementById('ownerBtnText');
            if (ownerBtnText) ownerBtnText.textContent = t.ownerButton;

            const langSpan = document.getElementById('langToggleText');
            if (langSpan) langSpan.textContent = t.langToggle;

            const backBtn = document.getElementById('backTopBtn');
            if (backBtn) backBtn.setAttribute('aria-label', t.backToTop);

            const darkIcon = document.querySelector('#darkToggleBtn i');
            if (darkIcon) {
                darkIcon.className = darkMode ? 'fas fa-sun' : 'fas fa-moon';
            }

            // modal translations
            const modalTitle = document.getElementById('modalTitle');
            const modalSub = document.getElementById('modalSub');
            const btn1 = document.getElementById('modalBtnAtitoFashion');
            const btn2 = document.getElementById('modalBtnAtitoOo');
            if (modalTitle) modalTitle.textContent = t.modalTitle;
            if (modalSub) modalSub.textContent = t.modalSub;
            if (btn1) btn1.innerHTML = '<i class="fab fa-instagram"></i> ' + t.modalBtn1;
            if (btn2) btn2.innerHTML = '<i class="fab fa-instagram"></i> ' + t.modalBtn2;
        }

        // ========================================================================
        //  RENDER MENU
        // ========================================================================
        function renderMenu() {
            const sectionsArea = document.getElementById('sectionsArea');
            if (!sectionsArea || !currentMenuData) return;

            const scrollDiv = document.getElementById('scrollMenuContainer');
            const oldScrollLeft = scrollDiv ? scrollDiv.scrollLeft : 0;

            sectionsArea.innerHTML = '';
            allSections = [];

            const filtered = currentMenuData.filter(c => {
                if (selectedTab === 'drinks') return c.category === 'drink';
                else if (selectedTab === 'food') return c.category === 'food';
                else if (selectedTab === 'birthday') return c.category === 'birthday';
                return false;
            });

            filtered.forEach(cat => {
                const sec = document.createElement('div');
                sec.className = 'menu-section';
                sec.dataset.sectionId = cat.id;

                const title = document.createElement('h3');
                title.className = 'section-title';
                title.textContent = getCategoryDisplayName(cat);
                sec.appendChild(title);

                const grid = document.createElement('div');
                grid.className = 'menu-items-grid';

                (cat.items || []).forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'menu-card';

                    const img = document.createElement('img');
                    img.src = getItemImage(item);
                    img.alt = getItemName(item);
                    img.className = 'menu-item-img';
                    img.loading = 'lazy';
                    img.onerror = function() {
                        this.src =
                            `https://picsum.photos/seed/${encodeURIComponent(item.name)}/400/400`;
                    };
                    card.appendChild(img);

                    const nameSpan = document.createElement('div');
                    nameSpan.className = 'item-name';
                    nameSpan.textContent = getItemName(item);
                    card.appendChild(nameSpan);

                    const priceSpan = document.createElement('div');
                    priceSpan.className = 'price';
                    const priceValue = String(item.price ?? '0').trim();
                    if (priceValue === '00') {
                        priceSpan.textContent = '00';
                    } else {
                        const amountSpan = document.createElement('span');
                        amountSpan.textContent = priceValue;
                        const currencySpan = document.createElement('span');
                        currencySpan.className = 'currency';
                        currencySpan.textContent = 'EGP';
                        priceSpan.appendChild(amountSpan);
                        priceSpan.appendChild(currencySpan);
                    }
                    card.appendChild(priceSpan);
                    grid.appendChild(card);
                });

                sec.appendChild(grid);
                sectionsArea.appendChild(sec);
                allSections.push(sec);
            });

            if (allSections.length) allSections[0].classList.add('active-section');

            rebuildNavButtons();
            applyRTL();
            applyStaticTranslations();

            if (scrollDiv) {
                scrollDiv.scrollLeft = oldScrollLeft;
                setTimeout(updateScrollHints, 80);
            }

            if (!scrollHintAnimationShown) setTimeout(triggerScrollHint, 500);
        }

        function rebuildNavButtons() {
            const container = document.getElementById('categoryButtons');
            if (!container || !currentMenuData) return;
            container.innerHTML = '';
            categoryButtonsRef = [];

            const filtered = currentMenuData.filter(c => {
                if (selectedTab === 'drinks') return c.category === 'drink';
                else if (selectedTab === 'food') return c.category === 'food';
                else if (selectedTab === 'birthday') return c.category === 'birthday';
                return false;
            });

            filtered.forEach((cat, idx) => {
                const btn = document.createElement('button');
                btn.className = 'cat-btn' + (idx === 0 ? ' active' : '');
                btn.textContent = getCategoryDisplayName(cat);
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    allSections.forEach(s => s.classList.toggle('active-section', s.dataset
                        .sectionId === cat.id));
                    btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                });
                container.appendChild(btn);
                categoryButtonsRef.push(btn);
            });

            if (allSections.length && !document.querySelector('.menu-section.active-section')) {
                allSections[0]?.classList.add('active-section');
            }

            const scrollDiv = document.getElementById('scrollMenuContainer');
            if (scrollDiv) {
                scrollDiv.removeEventListener('scroll', updateScrollHints);
                scrollDiv.addEventListener('scroll', updateScrollHints);
                setTimeout(updateScrollHints, 100);
            }

            const activeSec = document.querySelector('.menu-section.active-section');
            if (activeSec) {
                const activeId = activeSec.dataset.sectionId;
                document.querySelectorAll('.cat-btn').forEach((btn, i) => {
                    const cat = filtered[i];
                    if (cat && cat.id === activeId) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                });
            }
        }

        function triggerScrollHint() {
            if (scrollHintAnimationShown) return;
            const scrollDiv = document.getElementById('scrollMenuContainer');
            const wrapper = document.getElementById('scrollMenuWrapper');
            if (!scrollDiv || !wrapper) return;
            if (scrollDiv.scrollWidth <= scrollDiv.clientWidth) return;
            scrollHintAnimationShown = true;

            const rightHint = document.getElementById('scrollHintRight');
            if (rightHint) {
                rightHint.classList.add('scroll-hint-highlight');
                setTimeout(() => rightHint.classList.remove('scroll-hint-highlight'), 1300);
            }

            const tip = document.createElement('div');
            tip.className = 'scroll-arrow-tip';
            const isRTL = document.body.classList.contains('rtl');
            const moreText = getTranslation('moreItems');
            if (isRTL) {
                tip.innerHTML = `<i class="fas fa-arrow-left"></i> ${moreText} <i class="fas fa-arrow-left"></i>`;
            } else {
                tip.innerHTML = `<i class="fas fa-arrow-right"></i> ${moreText} <i class="fas fa-arrow-right"></i>`;
            }
            wrapper.style.position = 'relative';
            wrapper.appendChild(tip);
            setTimeout(() => { if (tip?.parentNode) tip.remove(); }, 3200);

            const orig = scrollDiv.scrollLeft;
            const max = scrollDiv.scrollWidth - scrollDiv.clientWidth;
            if (max > 20) {
                scrollDiv.style.scrollBehavior = 'smooth';
                const target = Math.min(orig + 70, max);
                scrollDiv.scrollTo({ left: target, behavior: 'smooth' });
                setTimeout(() => {
                    scrollDiv.scrollTo({ left: orig, behavior: 'smooth' });
                    setTimeout(() => { scrollDiv.style.scrollBehavior = 'smooth'; }, 400);
                }, 550);
            }
        }

        // ========================================================================
        //  LOAD DATA
        // ========================================================================
        function loadEmbeddedMenu() {
            currentMenuData = EMBEDDED_MENU.menuCatalog;
            renderMenu();
            applyStaticTranslations();
        }

        // ========================================================================
        //  LANGUAGE TOGGLE
        // ========================================================================
        function toggleLanguage() {
            currentLanguage = currentLanguage === 'ar' ? 'en' : 'ar';
            localStorage.setItem('softroof_lang', currentLanguage);
            if (currentMenuData) renderMenu();
            applyStaticTranslations();
            const t = currentLanguage === 'ar' ? TRANSLATIONS.ar : TRANSLATIONS.en;
            const darkText = document.getElementById('darkToggleText');
            if (darkText) darkText.textContent = darkMode ? t.darkOn : t.darkOff;
        }

        // ========================================================================
        //  DARK MODE
        // ========================================================================
        function toggleDarkMode() {
            darkMode = !darkMode;
            document.body.classList.toggle('dark-mode', darkMode);
            localStorage.setItem('softroof_dark', darkMode ? 'true' : 'false');
            const t = currentLanguage === 'ar' ? TRANSLATIONS.ar : TRANSLATIONS.en;
            const darkText = document.getElementById('darkToggleText');
            if (darkText) darkText.textContent = darkMode ? t.darkOn : t.darkOff;
            const darkIcon = document.querySelector('#darkToggleBtn i');
            if (darkIcon) {
                darkIcon.className = darkMode ? 'fas fa-sun' : 'fas fa-moon';
            }
        }

        function initDarkMode() {
            const saved = localStorage.getItem('softroof_dark');
            if (saved === 'true') {
                darkMode = true;
                document.body.classList.add('dark-mode');
                const t = currentLanguage === 'ar' ? TRANSLATIONS.ar : TRANSLATIONS.en;
                const darkText = document.getElementById('darkToggleText');
                if (darkText) darkText.textContent = t.darkOn;
                const darkIcon = document.querySelector('#darkToggleBtn i');
                if (darkIcon) darkIcon.className = 'fas fa-sun';
            } else {
                const t = currentLanguage === 'ar' ? TRANSLATIONS.ar : TRANSLATIONS.en;
                const darkText = document.getElementById('darkToggleText');
                if (darkText) darkText.textContent = t.darkOff;
                const darkIcon = document.querySelector('#darkToggleBtn i');
                if (darkIcon) darkIcon.className = 'fas fa-moon';
            }
        }

        // ========================================================================
        //  TAB SWITCH
        // ========================================================================
        function switchTab(tab) {
            selectedTab = tab;
            document.querySelectorAll('.nav-tab').forEach(t => {
                t.classList.toggle('active', t.dataset.tab === tab);
            });
            if (currentMenuData) renderMenu();
        }

        // ========================================================================
        //  BACK TO TOP
        // ========================================================================
        const backBtn = document.getElementById('backTopBtn');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 400) backBtn.classList.add('show');
            else backBtn.classList.remove('show');
        });
        backBtn.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // ========================================================================
        //  DRAG SCROLL
        // ========================================================================
        function enableDragScroll() {
            const slider = document.getElementById('scrollMenuContainer');
            if (!slider) return;
            let isDown = false,
                startX, scrollLeftStart;
            slider.addEventListener('mousedown', (e) => {
                isDown = true;
                slider.style.cursor = 'grabbing';
                startX = e.pageX - slider.offsetLeft;
                scrollLeftStart = slider.scrollLeft;
            });
            window.addEventListener('mouseup', () => {
                isDown = false;
                slider.style.cursor = 'grab';
            });
            window.addEventListener('mousemove', (e) => {
                if (!isDown) return;
                e.preventDefault();
                const x = e.pageX - slider.offsetLeft;
                const walk = (x - startX) * 1.2;
                slider.scrollLeft = scrollLeftStart - walk;
            });
            slider.style.cursor = 'grab';
        }

        // ========================================================================
        //  STICKY DETECTION
        // ========================================================================
        const stickyNav = document.getElementById('stickyNav');
        const observer = new IntersectionObserver(([e]) => {
            if (!e.isIntersecting) stickyNav.classList.add('sticky-active');
            else stickyNav.classList.remove('sticky-active');
        }, { threshold: [0], rootMargin: "-1px 0px 0px 0px" });
        setTimeout(() => {
            const sentinel = document.createElement('div');
            sentinel.style.position = 'absolute';
            sentinel.style.top = '0';
            sentinel.style.height = '1px';
            sentinel.style.width = '100%';
            if (stickyNav && stickyNav.parentNode) stickyNav.parentNode.insertBefore(sentinel, stickyNav);
            observer.observe(sentinel);
        }, 100);

        // ========================================================================
        //  MODAL (owner popup)
        // ========================================================================
        const modalOverlay = document.getElementById('ownerModal');
        const modalCloseBtn = document.getElementById('modalCloseBtn');
        const modalBox = document.querySelector('.modal-box');

        function openModal() {
            modalOverlay.classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modalOverlay.classList.remove('open');
            document.body.style.overflow = '';
        }

        // click on owner button (small)
        const ownerBtn = document.getElementById('ownerBtn');
        if (ownerBtn) {
            ownerBtn.addEventListener('click', openModal);
        }

        // close button
        if (modalCloseBtn) {
            modalCloseBtn.addEventListener('click', closeModal);
        }

        // click outside modal content
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) closeModal();
        });

        // escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modalOverlay.classList.contains('open')) {
                closeModal();
            }
        });

        // modal buttons - open Instagram links
        document.querySelectorAll('.modal-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const url = btn.getAttribute('data-url');
                if (url) {
                    window.open(url, '_blank', 'noopener,noreferrer');
                }
                closeModal();
            });
        });

        // ========================================================================
        //  INIT
        // ========================================================================
        document.addEventListener('DOMContentLoaded', function() {
            const savedLang = localStorage.getItem('softroof_lang');
            if (savedLang === 'ar' || savedLang === 'en') currentLanguage = savedLang;
            else currentLanguage = 'en';

            initDarkMode();
            loadEmbeddedMenu();

            document.getElementById('langToggleBtn')?.addEventListener('click', toggleLanguage);
            document.querySelectorAll('.nav-tab').forEach(tab => {
                tab.addEventListener('click', () => switchTab(tab.dataset.tab));
            });
            document.getElementById('darkToggleBtn')?.addEventListener('click', toggleDarkMode);

            enableDragScroll();
            window.addEventListener('resize', () => setTimeout(updateScrollHints, 100));

            document.getElementById('mainLogo').onerror = function() {
                this.style.backgroundColor = "#f0e0d8";
            };
        });
    </script>

</body>
