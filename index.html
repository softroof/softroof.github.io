      --text-price: #e07050; --price-bg: #2a1a10; --border-card: rgba(100,70,60,0.5);

      --scroll-track: #2a1a1a; --scroll-thumb: #6a4030; --scroll-thumb-hover: #8a6050;
      --cat-btn-bg: #2a1a1a; --cat-btn-border: #4a3020; --cat-btn-text: #d0c0b0;
      --cat-btn-active-bg: #8b2a1a; --cat-btn-active-text: #ffffff; --cat-btn-hover-bg: #3a2218;
      --footer-color: #7a5a4a; --footer-border: rgba(80,50,40,0.5);

      --hint-right: linear-gradient(to left, rgba(20,10,10,0.95), transparent);
      --lang-toggle-bg: rgba(40,20,20,0.9); --lang-toggle-border: rgba(80,50,40,0.6);
      --lang-toggle-color: #d0c0b0; --social-icon-color: #d0c0b0; --social-icon-bg: rgba(0,0,0,0.6);
      --social-icon-border: rgba(200,180,160,0.3); --social-icon-hover-bg: #8b2a1acc;
      --refresh-btn-bg: #8b2a1a; --refresh-btn-hover: #b03a2a; --shadow-header: 0 6px 14px rgba(0,0,0,0.6);
      --shadow-sticky: 0 4px 12px rgba(0,0,0,0.4); --shadow-sticky-active: 0 4px 18px rgba(0,0,0,0.5);

      --switch-active-bg: #8b2a1a; --switch-inactive-bg: rgba(255,255,240,0.08);
      --back-top-bg: #8b2a1a; --back-top-hover: #b03a2a; --back-top-color: #eee;
    }
    body { background: var(--bg-body); font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; color: var(--text-primary); line-height:1.4; transition:background 0.3s, color 0.3s; -webkit-tap-highlight-color:transparent; overflow-x:hidden; }

    .header-content { position:relative; z-index:2; padding:0.8rem 0.8rem 0.5rem; }
    .cafe-container { max-width:1280px; margin:0 auto; padding:0 1rem; }

    .logo-block { text-align:center; margin:0.8rem 0 0.5rem; }
    .logo-owner-row { display:flex; justify-content:center; align-items:center; gap:1rem; flex-wrap:wrap; margin-bottom:0.4rem; }
    .logo-img { width:140px; height:140px; object-fit:cover; background:var(--logo-bg); border-radius:30%; scale:1.0; box-shadow:var(--shadow-header); border:2px solid rgba(255,255,240,0.6); transition:background 0.3s; max-width:90vw; }

    .owner-image:hover { transform:scale(1.05); border-color:var(--border-card-hover); }
    .cafe-name { font-size:1.6rem; font-weight:700; margin-top:0.5rem; color:#fef7e0; text-shadow:2px 2px 5px rgba(0,0,0,0.5); }
    .tagline { font-size:0.7rem; font-style:italic; color:#f8f0da; margin-top:0.1rem; text-shadow:1px 1px 2px rgba(0,0,0,0.4); }
    .controls-wrapper { display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:0.5rem; margin-bottom:0.2rem; }
    .lang-toggle, .dark-toggle { background:var(--lang-toggle-bg); backdrop-filter:blur(4px); border:1px solid var(--lang-toggle-border); border-radius:60px; padding:0.4rem 0.9rem; font-family:'Helvetica Neue', Helvetica, Arial, sans-serif; font-size:0.7rem; font-weight:600; color:var(--lang-toggle-color); cursor:pointer; transition:0.2s; display:inline-flex; align-items:center; gap:5px; box-shadow:0 2px 6px rgba(0,0,0,0.1); }
    .lang-toggle i, .dark-toggle i { font-size:0.85rem; }
    .lang-toggle:hover, .dark-toggle:hover { background:var(--bg-card-hover); border-color:var(--border-card-hover); transform:scale(0.98); }
    .social-links { display:flex; flex-wrap:wrap; justify-content:center; gap:1rem; margin:0.6rem 0 0.2rem; }
    .social-icon { color:var(--social-icon-color); font-size:1.1rem; background:var(--social-icon-bg); width:34px; height:34px; display:inline-flex; align-items:center; justify-content:center; border-radius:40px; text-decoration:none; border:1px solid var(--social-icon-border); transition:0.2s; backdrop-filter:blur(2px); }
    .social-icon:hover { color:#fff; background:var(--social-icon-hover-bg); transform:translateY(-2px); border-color:#f5d8c8; }
    /* ----- owner above menu ----- */
    .owner-strip { display:flex; justify-content:center; align-items:center; gap:1rem; padding:0.3rem 1rem 0.2rem; flex-wrap:wrap; }
    .owner-strip span { font-size:1rem; font-weight:600; color:var(--footer-color); letter-spacing:0.5px; }
    .owner-strip .highlight { color:var(--text-price); font-weight:700; }
    /* ----- sticky navigation (dual) ----- */
    .sticky-nav { position:sticky; top:0; z-index:100; background:var(--sticky-bg); backdrop-filter:blur(12px); border-bottom:1px solid var(--footer-border); padding:0.3rem 0 0.6rem; transition:all 0.2s; box-shadow:var(--shadow-sticky); }
    .sticky-nav.sticky-active { box-shadow:var(--shadow-sticky-active); background:var(--sticky-bg-active); }
    .nav-toggle-wrap { display:flex; justify-content:center; margin:0.2rem 0 0.6rem; }
    .nav-tabs { display:inline-flex; justify-content:center; align-items:center; gap:0.45rem; padding:0.45rem; border:1px solid var(--cat-btn-border); border-radius:999px; background:var(--cat-btn-bg); box-shadow:0 2px 8px rgba(0,0,0,0.06); width:fit-content; }
    .nav-tab { font-family:'Helvetica Neue', Helvetica, Arial, sans-serif; background:transparent; border:none; font-size:1.05rem; font-weight:700; padding:0.7rem 1.5rem; cursor:pointer; color:var(--cat-btn-text); transition:all 0.2s ease; border-radius:999px; min-width:125px; }
    .nav-tab.active { background:var(--cat-btn-active-bg); color:var(--cat-btn-active-text); box-shadow:0 4px 10px rgba(139,42,26,0.2); }
    .nav-tab:hover:not(.active) { background:var(--cat-btn-hover-bg); }
    .scroll-menu-wrapper { position:relative; max-width:1280px; margin:0 auto; padding:0 0.8rem; }
    .scroll-menu { overflow-x:auto; overflow-y:hidden; white-space:nowrap; scrollbar-width:thin; padding-bottom:0.4rem; cursor:grab; scroll-behavior:smooth; -webkit-overflow-scrolling:touch; }
    .scroll-menu:active { cursor:grabbing; }
    .scroll-menu::-webkit-scrollbar { height:4px; }
    .scroll-menu::-webkit-scrollbar-track { background:var(--scroll-track); border-radius:10px; }
    .scroll-menu::-webkit-scrollbar-thumb { background:var(--scroll-thumb); border-radius:10px; }
    .scroll-menu::-webkit-scrollbar-thumb:hover { background:var(--scroll-thumb-hover); }
    .menu-buttons { display:inline-flex; gap:0.6rem; padding:0.2rem 0.1rem; }
    .cat-btn { font-family:'Helvetica Neue', Helvetica, Arial, sans-serif; background:var(--cat-btn-bg); border:1px solid var(--cat-btn-border); padding:0.4rem 1.2rem; font-size:0.85rem; border-radius:60px; cursor:pointer; color:var(--cat-btn-text); transition:all 0.2s; font-weight:600; box-shadow:0 1px 2px rgba(0,0,0,0.04); white-space:nowrap; }
    .cat-btn.active { background:var(--cat-btn-active-bg); color:var(--cat-btn-active-text); border-color:var(--cat-btn-active-bg); box-shadow:0 4px 8px rgba(139,42,26,0.3); }
    .cat-btn:hover:not(.active) { background:var(--cat-btn-hover-bg); transform:translateY(-1px); }
    .scroll-hint-left, .scroll-hint-right { position:absolute; top:0; bottom:4px; width:35px; pointer-events:none; z-index:5; transition:opacity 0.25s; }
    .scroll-hint-left { left:0; background:var(--hint-left); }
    .scroll-hint-right { right:0; background:var(--hint-right); }
    /* ----- menu sections ----- */
    .sections-wrapper { position:relative; background:var(--section-bg); backdrop-filter:blur(3px); border-radius:1.5rem 1.5rem 0 0; margin-top:0.3rem; padding:1rem 0 5rem; box-shadow:inset 0 1px 20px rgba(160,120,100,0.08), 0 8px 20px rgba(0,0,0,0.02); transition:background 0.3s; }
    .sections-area { display:grid; grid-template-columns:1fr 1fr; gap:1.2rem; }
    .menu-section { display:none; grid-column:1 / -1; }
    .menu-section.active-section { display:block; }
    .menu-section .menu-items-grid { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:1rem; }
    @media (min-width:769px) { .menu-section .menu-items-grid { padding:0 8rem; } }
    .menu-card { background:var(--bg-card); backdrop-filter:blur(2px); border-radius:24px; padding:0.8rem 0.5rem; border:1px solid var(--border-card); transition:all 0.25s; box-shadow:var(--shadow-card); display:flex; flex-direction:column; align-items:center; text-align:center; gap:0.25rem; width:100%; height:100%; }
    .menu-card:hover { background:var(--bg-card-hover); border-color:var(--border-card-hover); transform:translateY(-3px); box-shadow:var(--shadow-card-hover); }
    .menu-item-img { width:100%; aspect-ratio:1/1; border-radius:16px; object-fit:cover; flex-shrink:0; border:2px solid var(--border-card); background:var(--bg-body); transition:border-color 0.3s, transform 0.2s; margin-bottom:0.1rem; max-width:100%; }
    .menu-card:hover .menu-item-img { border-color:var(--border-card-hover); transform:scale(1.02); }
    .item-name { font-size:1.1rem; font-weight:700; color:var(--text-heading); letter-spacing:-0.2px; text-align:center; width:100%; word-break:break-word; line-height:1.3; }
    .price { font-size:1.5rem; font-weight:900; color:var(--text-price); background:var(--price-bg); padding:0.3rem 0rem; border-radius:50px; white-space:normal; word-break:break-word; overflow-wrap:anywhere; border:2px solid var(--border-card); box-shadow:0 2px 8px rgba(0,0,0,0.05); line-height:1.3; display:inline-block; text-align:center; margin-top:0.1rem; letter-spacing:0.5px; width:100%; max-width:130px; transition:background 0.3s, color 0.3s, border-color 0.3s; }
    .price .currency { font-size:0.85em; font-weight:700; display:inline-block; margin-left:0.25rem; vertical-align:middle; }
    .section-title { font-size:1.5rem; font-weight:700; margin-bottom:1rem; color:var(--text-heading); border-left:5px solid #c07060; padding-left:0.8rem; text-shadow:0 1px 1px rgba(255,200,180,0.3); transition:color 0.3s, border-color 0.3s; }

    body.rtl .section-title { border-left:none; border-right:5px solid #c07060; padding-left:0; padding-right:0.8rem; }

    .back-top.show { opacity:1; visibility:visible; pointer-events:auto; transform:translateY(0); }
    .back-top:hover { background:var(--back-top-hover); transform:scale(1.08); }
    /* ----- rtl adjustments ----- */
    body.rtl { direction:rtl; text-align:right; font-family:'Cairo', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    body.rtl .scroll-hint-left { background:var(--hint-right); left:auto; right:0; }
    body.rtl .cafe-name,
    body.rtl .tagline,
    body.rtl .section-title,
    body.rtl .item-name,
    body.rtl .price,
    body.rtl .lang-toggle,
    body.rtl .dark-toggle,
    body.rtl .nav-tab,
    body.rtl .cat-btn,

    }

    body.rtl .back-top { right:auto; left:24px; }
    /* responsive */

      .menu-section .menu-items-grid { grid-template-columns:repeat(2, minmax(0, 1fr)); padding:0 0.3rem; }
    }

      .logo-img { width:120px; height:120px; }

      .cat-btn { font-size:0.7rem; padding:0.25rem 0.8rem; }

      body.rtl .section-title { padding-right:0.6rem; }
      .menu-item-img { aspect-ratio:1/1; border-radius:12px; }
      .item-name { font-size:0.9rem; }

      .menu-card { padding:0.5rem 0.3rem; gap:0.15rem; border-radius:16px; }
      .owner-strip img { width:120px; height:120px; }
      .nav-tab { font-size:0.95rem; padding:0.55rem 1rem; min-width:180px; }
      .back-top { width:44px; height:44px; font-size:1.2rem; bottom:16px; right:16px; }
      body.rtl .back-top { right:auto; left:16px; }
    }

      .menu-card { padding:0.4rem 0.2rem; border-radius:12px; }
      .menu-section .menu-items-grid { gap:0.4rem; padding:0 0.2rem; }
    }
  </style>
</head>

          { name:"Butter croissant with tuna mix, lettuce & pickles.", desc:"كرواسون بالزبدة مع تونة، خس ومخلل.", price:"soon", image:"https://drive.google.com/thumbnail?id=1i3OMTdS1exkLFEBWkHnRt8rDQjXAswA-&sz=s800" }
        ]}
      ]
    };

    // ============ STATE ============
    let currentLanguage = 'en';
    let selectedTab = 'drinks'; // 'drinks' or 'food'
    let allSections = [];
    let categoryButtonsRef = [];
    let scrollHintAnimationShown = false;
    let currentMenuData = null;

    // ============ HELPERS ============
    function getCategoryDisplayName(cat) {
      return currentLanguage === 'en' ? (cat.label || cat.id) : (cat.title || cat.label || cat.id);
    }
    function getItemName(item) {
      return currentLanguage === 'en' ? (item.name || 'Item') : (item.desc || item.name || 'عنصر');
    }
    function getItemImage(item) {
      if (item.image && item.image !== '') return item.image;
      return 'https://i.etsystatic.com/16237790/r/il/591da5/5840470695/il_fullxfull.5840470695_gwx4.jpg';
    }
    function applyRTL() {
      if (currentLanguage === 'ar') { document.body.classList.add('rtl'); document.documentElement.lang='ar'; document.documentElement.dir='rtl'; }
      else { document.body.classList.remove('rtl'); document.documentElement.lang='en'; document.documentElement.dir='ltr'; }
      setTimeout(updateScrollHints, 50);
    }

    function updateScrollHints() {
      const scrollDiv = document.getElementById('scrollMenuContainer');
      if (!scrollDiv) return;
      const l = document.getElementById('scrollHintLeft'), r = document.getElementById('scrollHintRight');
      if (!l||!r) return;
      const sl = scrollDiv.scrollLeft, max = scrollDiv.scrollWidth - scrollDiv.clientWidth;
      l.style.opacity = sl > 6 ? '1' : '0';
      r.style.opacity = (max - sl) > 8 ? '1' : '0';
    }

    // ============ RENDER MENU ============
    function renderMenu() {
      const sectionsArea = document.getElementById('sectionsArea');
      if (!sectionsArea || !currentMenuData) return;
      sectionsArea.innerHTML = '';
      allSections = [];
      const filtered = currentMenuData.filter(c => {
        if (selectedTab === 'drinks') return c.category === 'drink';
        else return c.category === 'food';
      });
      filtered.forEach(cat => {
        const sec = document.createElement('div');
        sec.className = 'menu-section';
        sec.dataset.sectionId = cat.id;
        const title = document.createElement('h3');
        title.className = 'section-title';
        title.textContent = getCategoryDisplayName(cat);
        sec.appendChild(title);
        const grid = document.createElement('div');
        grid.className = 'menu-items-grid';
        (cat.items||[]).forEach(item => {
          const card = document.createElement('div');
          card.className = 'menu-card';
          const img = document.createElement('img');
          img.src = getItemImage(item);
          img.alt = item.name;
          img.className = 'menu-item-img';
          img.loading = 'lazy';
          img.onerror = function() { this.src = `https://picsum.photos/seed/${encodeURIComponent(item.name)}/400/400`; };
          card.appendChild(img);
          const nameSpan = document.createElement('div');
          nameSpan.className = 'item-name';
          nameSpan.textContent = getItemName(item);
          card.appendChild(nameSpan);
          const priceSpan = document.createElement('div');
          priceSpan.className = 'price';
          const priceValue = String(item.price ?? '0').trim();
          if (priceValue === '00') {
            priceSpan.textContent = '00';
          } else {
            const amountSpan = document.createElement('span');
            amountSpan.textContent = priceValue;
            const currencySpan = document.createElement('span');
            currencySpan.className = 'currency';
            currencySpan.textContent = 'EGP';
            priceSpan.appendChild(amountSpan);
            priceSpan.appendChild(currencySpan);
          }
          card.appendChild(priceSpan);
          grid.appendChild(card);
        });
        sec.appendChild(grid);
        sectionsArea.appendChild(sec);
        allSections.push(sec);
      });
      if (allSections.length) allSections[0].classList.add('active-section');
      rebuildNavButtons();
      applyRTL();
      if (!scrollHintAnimationShown) setTimeout(triggerScrollHint, 400);
    }

    function rebuildNavButtons() {
      const container = document.getElementById('categoryButtons');
      if (!container || !currentMenuData) return;
      container.innerHTML = '';
      categoryButtonsRef = [];
      const filtered = currentMenuData.filter(c => {
        if (selectedTab === 'drinks') return c.category === 'drink';
        else return c.category === 'food';
      });
      filtered.forEach((cat, idx) => {
        const btn = document.createElement('button');
        btn.className = 'cat-btn' + (idx === 0 ? ' active' : '');
        btn.textContent = getCategoryDisplayName(cat);
        btn.addEventListener('click', () => {
          document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          allSections.forEach(s => s.classList.toggle('active-section', s.dataset.sectionId === cat.id));
          btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        });
        container.appendChild(btn);
        categoryButtonsRef.push(btn);
      });
      // ensure first section active
      if (allSections.length && !document.querySelector('.menu-section.active-section')) allSections[0]?.classList.add('active-section');
      const scrollDiv = document.getElementById('scrollMenuContainer');
      if (scrollDiv) {
        scrollDiv.removeEventListener('scroll', updateScrollHints);
        scrollDiv.addEventListener('scroll', updateScrollHints);
        setTimeout(updateScrollHints, 100);
      }
    }

    function triggerScrollHint() {
      if (scrollHintAnimationShown) return;
      const scrollDiv = document.getElementById('scrollMenuContainer');
      const wrapper = document.getElementById('scrollMenuWrapper');
      if (!scrollDiv || !wrapper) return;
      if (scrollDiv.scrollWidth <= scrollDiv.clientWidth) return;
      scrollHintAnimationShown = true;
      const rightHint = document.getElementById('scrollHintRight');
      if (rightHint) { rightHint.classList.add('scroll-hint-highlight'); setTimeout(()=>rightHint.classList.remove('scroll-hint-highlight'),1300); }
      const tip = document.createElement('div');
      tip.className = 'scroll-arrow-tip';
      const isRTL = document.body.classList.contains('rtl');
      tip.innerHTML = isRTL ? '<i class="fas fa-arrow-left"></i> المزيد <i class="fas fa-arrow-left"></i>' : '<i class="fas fa-arrow-right"></i> more items <i class="fas fa-arrow-right"></i>';
      wrapper.style.position = 'relative';
      wrapper.appendChild(tip);
      setTimeout(()=>{ if(tip?.parentNode) tip.remove(); },3200);
      const orig = scrollDiv.scrollLeft;
      const max = scrollDiv.scrollWidth - scrollDiv.clientWidth;
      if (max>20) {
        scrollDiv.style.scrollBehavior = 'smooth';
        const target = Math.min(orig+70, max);
        scrollDiv.scrollTo({ left: target, behavior: 'smooth' });
        setTimeout(()=>{ scrollDiv.scrollTo({ left: orig, behavior: 'smooth' }); setTimeout(()=>{ scrollDiv.style.scrollBehavior = 'smooth'; },400); },550);
      }
    }

    // ============ LOAD DATA ============
    function loadEmbeddedMenu() {
      currentMenuData = EMBEDDED_MENU.menuCatalog;
      renderMenu();
      // update language toggle text
      document.getElementById('langToggleText').innerHTML = currentLanguage === 'ar' ? '🇸🇦 العربية / English' : 'English / العربية';
    }

    // ============ LANGUAGE TOGGLE ============
    function toggleLanguage() {
      currentLanguage = currentLanguage === 'ar' ? 'en' : 'ar';
      localStorage.setItem('softroof_lang', currentLanguage);
      document.getElementById('langToggleText').innerHTML = currentLanguage === 'ar' ? '🇸🇦 العربية / English' : 'English / العربية';
      if (currentMenuData) renderMenu();
    }

    // ============ DARK MODE ============
    let darkMode = false;
    const darkToggleBtn = document.getElementById('darkToggleBtn');
    const darkToggleText = document.getElementById('darkToggleText');
    function toggleDarkMode() {
      darkMode = !darkMode;
      document.body.classList.toggle('dark-mode', darkMode);
      localStorage.setItem('softroof_dark', darkMode ? 'true' : 'false');
      darkToggleText.textContent = darkMode ? 'Light' : 'Dark';
      darkToggleBtn.querySelector('i').className = darkMode ? 'fas fa-sun' : 'fas fa-moon';
    }
    function initDarkMode() {
      const saved = localStorage.getItem('softroof_dark');
      if (saved === 'true') { darkMode=true; document.body.classList.add('dark-mode'); darkToggleText.textContent='Light'; darkToggleBtn.querySelector('i').className='fas fa-sun'; }
      else { darkToggleText.textContent='Dark'; darkToggleBtn.querySelector('i').className='fas fa-moon'; }
    }
    darkToggleBtn?.addEventListener('click', toggleDarkMode);

    // ============ TAB SWITCH ============
    function switchTab(tab) {
      selectedTab = tab;
      document.querySelectorAll('.nav-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
      if (currentMenuData) renderMenu();
      // show back-to-top after scroll
    }

    // ============ BACK TO TOP ============
    const backBtn = document.getElementById('backTopBtn');
    window.addEventListener('scroll', ()=>{
      if (window.scrollY > 400) backBtn.classList.add('show');
      else backBtn.classList.remove('show');
    });
    backBtn.addEventListener('click', ()=>{
      window.scrollTo({ top:0, behavior:'smooth' });
    });

    // ============ DRAG SCROLL ============
    function enableDragScroll() {
      const slider = document.getElementById('scrollMenuContainer');
      if (!slider) return;
      let isDown=false, startX, scrollLeftStart;
      slider.addEventListener('mousedown', (e)=>{ isDown=true; slider.style.cursor='grabbing'; startX=e.pageX-slider.offsetLeft; scrollLeftStart=slider.scrollLeft; });
      window.addEventListener('mouseup', ()=>{ isDown=false; slider.style.cursor='grab'; });
      window.addEventListener('mousemove', (e)=>{ if(!isDown) return; e.preventDefault(); const x=e.pageX-slider.offsetLeft; const walk=(x-startX)*1.2; slider.scrollLeft=scrollLeftStart-walk; });
      slider.style.cursor='grab';
    }

    // ============ STICKY DETECTION ============
    const stickyNav = document.getElementById('stickyNav');
    const observer = new IntersectionObserver(([e])=>{
      if (!e.isIntersecting) stickyNav.classList.add('sticky-active');
      else stickyNav.classList.remove('sticky-active');
    }, { threshold:[0], rootMargin:"-1px 0px 0px 0px" });
    setTimeout(()=>{
      const sentinel = document.createElement('div');
      sentinel.style.position='absolute'; sentinel.style.top='0'; sentinel.style.height='1px'; sentinel.style.width='100%';
      if (stickyNav && stickyNav.parentNode) stickyNav.parentNode.insertBefore(sentinel, stickyNav);
      observer.observe(sentinel);
    },100);

    // ============ INIT ============
    document.getElementById('langToggleBtn')?.addEventListener('click', toggleLanguage);
    document.querySelectorAll('.nav-tab').forEach(tab => {
      tab.addEventListener('click', ()=> switchTab(tab.dataset.tab));
    });
    // restore language
    const savedLang = localStorage.getItem('softroof_lang');
    if (savedLang === 'ar' || savedLang === 'en') currentLanguage = savedLang;
    else currentLanguage = 'en';
    initDarkMode();
    loadEmbeddedMenu();
    enableDragScroll();
    window.addEventListener('resize', ()=> setTimeout(updateScrollHints,100));
    document.getElementById('mainLogo').onerror = function(){ this.style.backgroundColor="#f0e0d8"; };
  </script>
</body>
</html>
